<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>404 — Page introuvable</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: Tahoma, Verdana, sans-serif; color: #14213d; overflow: hidden;
         background: linear-gradient(#3a7bd5 0%, #6aa7f0 52%, #5fae3a 52.1%, #3f8f22 100%); }
  .win { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -54%); width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 56px);
         background: #ece9d8; border: 3px solid #0a49c9; border-radius: 9px 9px 4px 4px; box-shadow: 0 10px 30px rgba(0,0,0,.45); overflow: hidden; display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 6px 8px; color: #fff; font-weight: bold; font-size: 13px; background: linear-gradient(#3d95ff, #0a5ce6 45%, #0847c4); text-shadow: 1px 1px 0 rgba(0,0,0,.4); }
  .bar .x { margin-left: auto; width: 22px; height: 22px; border-radius: 4px; background: linear-gradient(#e9764d,#c9381a); border: 1px solid #fff; text-align: center; line-height: 19px; font-size: 14px; }
  .body { display: flex; align-items: center; gap: 16px; padding: 18px 18px 8px; background: linear-gradient(#f3f8ff,#dbe9fb); overflow: auto; }
  .body svg { width: 120px; height: auto; flex: none; animation: bob 3.2s ease-in-out infinite; filter: drop-shadow(0 3px 3px rgba(0,0,0,.2)); }
  .bubble { position: relative; flex: 1; background: #fff; border: 2px solid #1b4f9c; border-radius: 14px; padding: 12px 14px; font-size: 14px; line-height: 1.5; }
  .bubble::before { content: ''; position: absolute; left: -11px; top: 36px; width: 18px; height: 18px; background: #fff; border-left: 2px solid #1b4f9c; border-bottom: 2px solid #1b4f9c; transform: rotate(45deg); }
  .code { font-size: 38px; font-weight: bold; color: #c9381a; line-height: 1; margin: 0 0 4px; }
  .bubble p { margin: 4px 0; }
  .addr { font-size: 11px; color: #667; word-break: break-all; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; padding: 10px 18px 16px; background: linear-gradient(#dbe9fb,#dbe9fb); }
  .actions a, .actions button { padding: 7px 14px; font: 12px Tahoma, sans-serif; color: #000; text-decoration: none; border: 1px solid #003c74; border-radius: 4px; background: linear-gradient(#fff,#e3e3e0); cursor: pointer; }
  .actions .main { background: linear-gradient(#5aa0ff,#2f6fe0); color: #fff; font-weight: bold; }
  .task { position: fixed; left: 0; right: 0; bottom: 0; height: 32px; display: flex; align-items: center; justify-content: space-between; padding-right: 12px; color: #fff; font-size: 12px;
          background: linear-gradient(#3d8bf0,#245edb 15%,#1f4fc0 85%,#1941a5); }
  .start { height: 100%; padding: 0 22px 0 14px; display: flex; align-items: center; font: italic bold 16px Tahoma, sans-serif; background: linear-gradient(#5fb747,#3c8f26); border-radius: 0 14px 14px 0; box-shadow: 2px 0 4px rgba(0,0,0,.4); }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @media (prefers-reduced-motion: reduce) { .body svg { animation: none; } }
  @media (max-width: 480px) { .body { flex-direction: column; align-items: stretch; } .body svg { width: 96px; align-self: center; }
    .bubble::before { left: calc(50% - 9px); top: -10px; border-left: 2px solid #1b4f9c; border-top: 2px solid #1b4f9c; border-bottom: 0; } .actions { justify-content: stretch; } .actions > * { flex: 1 1 100%; text-align: center; } }
</style>
</head>
<body>
<main class="win" role="alert">
  <div class="bar"><span id="t-title">Erreur — Page introuvable</span><span class="x" aria-hidden="true">×</span></div>
  <div class="body">

  <defs>

    <linearGradient id="o" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd25a"/><stop offset="1" stop-color="#f29a0a"/></linearGradient>

  <ellipse cx="60" cy="134" rx="30" ry="4.5" fill="#000" opacity=".18"/>

  <rect x="16" y="26" width="88" height="78" rx="36" fill="url(#g)" stroke="#1b4f9c" stroke-width="3"/>
  <rect x="26" y="38" width="68" height="52" rx="26" fill="#eef6ff" stroke="#1b4f9c" stroke-width="2"/>
  <ellipse cx="46" cy="64" rx="5.5" ry="7.5" fill="#1b2a4a"/><ellipse cx="74" cy="64" rx="5.5" ry="7.5" fill="#1b2a4a"/>

    <div class="bubble">
      <p class="code">404</p>
      <p id="t-msg"></p>
      <p class="addr"><span id="t-addr">Adresse demandée :</span> <b id="addr"></b></p>
    </div>
  </div>
  <div class="actions">
    <a class="main" id="home" href="/">🏠 <span id="t-home">Retour au bureau</span></a>
    <a id="chat" href="/?chat=1">💬 <span id="t-chat">Demander à la mascotte</span></a>
    <button type="button" id="back">◀ <span id="t-back">Page précédente</span></button>
  </div>
</main>
<div class="task"><div class="start">démarrer</div><span id="clock"></span></div>
<script>
(function () {
  var fr = !/^(en)/i.test(navigator.language || 'fr');
  var T = fr ? {
    title: 'Erreur — Page introuvable', addr: 'Adresse demandée :', home: 'Retour au bureau', chat: 'Demander à NAME', back: 'Page précédente',
    msg: 'Oups ! J\'ai cherché partout, mais cette page n\'existe pas (ou plus). Pas de panique, le bureau de Justin est juste à côté.'
  } : {
    title: 'Error — Page not found', addr: 'Requested address:', home: 'Back to the desktop', chat: 'Ask NAME', back: 'Previous page',
    msg: 'Oops! I looked everywhere, but this page doesn\'t exist (anymore). Don\'t worry, Justin\'s desktop is right next door.'
  };
  document.documentElement.lang = fr ? 'fr' : 'en';
  function fill(name) {
    document.getElementById('t-title').textContent = T.title;
    document.getElementById('t-addr').textContent = T.addr;
    document.getElementById('t-home').textContent = T.home;
    document.getElementById('t-chat').textContent = T.chat.replace('NAME', name);
    document.getElementById('t-back').textContent = T.back;
    document.getElementById('t-msg').textContent = T.msg;
    document.title = '404 — ' + (fr ? 'Page introuvable' : 'Page not found');
  }
  fill('Mascotte');
  document.getElementById('addr').textContent = decodeURI(location.pathname + location.search);
  document.getElementById('back').addEventListener('click', function () { if (history.length > 1) history.back(); else location.href = document.getElementById('home').href; });
  function tick() { var d = new Date(); document.getElementById('clock').textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  tick(); setInterval(tick, 15000);

  /* Retrouver la racine du site (utile si le site est dans un sous-dossier, ex. GitHub Pages) et le nom de la mascotte */
  var seg = location.pathname.split('/')[1];
  var bases = ['/'];
  if (seg) bases.push('/' + seg + '/');
  (function probe(i) {
    if (i >= bases.length) return;
    fetch(bases[i] + 'config.js', { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : Promise.reject(); }).then(function (txt) {
      if (txt.indexOf('const SITE') < 0) return Promise.reject();
      document.getElementById('home').href = bases[i];
      document.getElementById('chat').href = bases[i] + '?chat=1';
      var m = txt.match(/mascotte:\s*'([^']*)'/);
      if (m && m[1]) fill(m[1]);
    }).catch(function () { probe(i + 1); });
  })(0);
})();
</script>
